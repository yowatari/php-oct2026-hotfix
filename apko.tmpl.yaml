# Rendered by scripts/render.sh -> build/apko.yaml.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local /work/build/@@VERSION@@/packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - /work/melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - php-hotfix=@@VERSION@@-r@@EPOCH@@@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/php

annotations:
  org.opencontainers.image.title: php-hotfix
  org.opencontainers.image.version: "@@VERSION@@"
  org.opencontainers.image.description: "PHP @@VERSION@@-r@@EPOCH@@ (fixes CVE-2026-109618, CVE-2026-109619)"
  org.opencontainers.image.source: https://github.com/yowatari/php-oct2026-hotfix

archs:
  - x86_64
