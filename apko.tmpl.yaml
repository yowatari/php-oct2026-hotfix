# Rendered by scripts/render.sh -> build/<version>/apko.yaml (CLI) and apko-fpm.yaml.
contents:
  # The locally built apk repository and melange.rsa.pub are appended at build
  # time (apko -r/-k, or the apko-publish action's repository/keyring-append).
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - php-hotfix=@@VERSION@@-r@@EPOCH@@
# @@FPM_PACKAGE@@

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: @@ENTRYPOINT@@

annotations:
  org.opencontainers.image.title: php-hotfix@@FLAVOR_SUFFIX@@
  org.opencontainers.image.version: "@@VERSION@@"
  org.opencontainers.image.description: "PHP @@VERSION@@-r@@EPOCH@@ (fixes CVE-2026-109618, CVE-2026-109619)"
  org.opencontainers.image.source: https://github.com/yowatari/php-oct2026-hotfix

archs:
  - x86_64
