name: build

on:
  push:
    paths:
      - melange.tmpl.yaml
      - apko.tmpl.yaml
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON list of PHP versions, e.g. ["8.5.12","7.4.33"]'
        required: false
        default: ""

permissions:
  contents: read

env:
  # Supported branches: fixed tarballs. EOL branches: last tarball + patches/<branch>/.
  DEFAULT_VERSIONS: '["8.5.12","8.4.27","8.3.36","8.2.35","8.1.34","8.0.30","7.4.33"]'
  MELANGE_IMAGE: cgr.dev/chainguard/melange:latest
  APKO_IMAGE: cgr.dev/chainguard/apko:latest

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.versions }}
        run: echo "versions=${INPUT:-$DEFAULT_VERSIONS}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Render melange/apko config
        id: render
        run: scripts/render.sh "${{ matrix.version }}"

      - name: melange keygen
        run: docker run --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" keygen melange.rsa

      - name: melange build (fetch, patch, compile, test)
        run: |
          docker run --privileged --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" \
            build "${{ steps.render.outputs.dir }}/melange.yaml" \
            --arch x86_64 \
            --signing-key melange.rsa \
            --source-dir "${{ steps.render.outputs.dir }}/src" \
            --out-dir "${{ steps.render.outputs.dir }}/packages"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: apko publish (image + SBOM)
        id: publish
        env:
          VERSION: ${{ steps.render.outputs.version }}
          BRANCH: ${{ steps.render.outputs.branch }}
          EPOCH: ${{ steps.render.outputs.epoch }}
          DIR: ${{ steps.render.outputs.dir }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### PHP $VERSION-r$EPOCH"
            echo
            echo "- patches applied: ${{ steps.render.outputs.patches }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # "" = php CLI image, "-fpm" = php-fpm image
          for flavor in "" -fpm; do
            tags=("$image:$VERSION-r$EPOCH$flavor" "$image:$BRANCH$flavor")
            # A pristine tarball build may also own the bare version tag.
            [ "$EPOCH" = 0 ] && tags+=("$image:$VERSION$flavor")
            docker run --rm -v "$PWD":/work -w /work -v "$HOME/.docker":/root/.docker:ro "$APKO_IMAGE" \
              publish "$DIR/apko$flavor.yaml" "${tags[@]}" --image-refs "$DIR/image-refs$flavor.txt"
            ref="$(head -n1 "$DIR/image-refs$flavor.txt")" # image@sha256:...
            echo "ref${flavor//-/_}=$ref" >> "$GITHUB_OUTPUT"
            {
              echo "- digest${flavor}: \`$ref\`"
              printf -- '  - tag: `%s`\n' "${tags[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke test
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_FPM: ${{ steps.publish.outputs.ref_fpm }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          docker run --rm "$REF" -v | tee /dev/stderr | grep -q "PHP $VERSION "
          docker run --rm "$REF" -r 'exit(file_exists("/usr/bin/php-fpm") ? 1 : 0);'
          docker run --rm --entrypoint /usr/bin/php-fpm "$REF_FPM" -t -y /etc/php/php-fpm.conf
          # fpm must come up as nonroot and stay up
          docker run -d --name fpm "$REF_FPM"
          sleep 3
          docker logs fpm 2>&1 | tee /dev/stderr | grep -q "ready to handle connections"
          test "$(docker inspect -f '{{.State.Running}}' fpm)" = true
          docker rm -f fpm

      - uses: sigstore/cosign-installer@v3

      - name: cosign sign (keyless)
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_FPM: ${{ steps.publish.outputs.ref_fpm }}
        run: cosign sign --yes "$REF" "$REF_FPM"
