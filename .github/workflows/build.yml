name: build

on:
  push:
    paths:
      - melange.tmpl.yaml
      - apko.tmpl.yaml
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON list of PHP versions, e.g. ["8.5.12","7.4.33"]'
        required: false
        default: ""

permissions:
  contents: read

env:
  # Supported branches: fixed tarballs. EOL branches: last tarball + patches/<branch>/.
  DEFAULT_VERSIONS: '["8.5.12","8.4.27","8.3.36","8.2.35","8.1.34","8.0.30","7.4.33"]'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.versions }}
        run: echo "versions=${INPUT:-$DEFAULT_VERSIONS}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Render melange/apko config
        id: render
        run: scripts/render.sh "${{ matrix.version }}"

      # Installs melange + bubblewrap on the runner, generates a throwaway
      # signing key, then fetches, patches, builds and tests the apks.
      - name: melange build (fetch, patch, compile, test)
        uses: chainguard-dev/actions/melange-build@53668650c25af6e8864f1d1ddaa69ed4db4cdf09 # v1.6.42
        with:
          version: v0.63.0
          config: ${{ steps.render.outputs.dir }}/melange.yaml
          source-dir: ${{ steps.render.outputs.dir }}/src
          repository-path: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages
          archs: x86_64
          sign-with-temporary-key: true
          signing-key-path: ${{ github.workspace }}/melange.rsa

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ steps.render.outputs.version }}
          BRANCH: ${{ steps.render.outputs.branch }}
          EPOCH: ${{ steps.render.outputs.epoch }}
        run: |
          image="${IMAGE,,}"
          for flavor in "" -fpm; do
            tags="$image:$VERSION-r$EPOCH$flavor $image:$BRANCH$flavor"
            # A pristine tarball build may also own the bare version tag.
            if [ "$EPOCH" = 0 ]; then tags="$tags $image:$VERSION$flavor"; fi
            echo "tags${flavor//-/_}=$tags" >> "$GITHUB_OUTPUT"
          done

      - name: apko publish (php CLI image + SBOM)
        uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          config: ${{ steps.render.outputs.dir }}/apko.yaml
          tag: ${{ steps.tags.outputs.tags }}
          repository-append: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages
          keyring-append: ${{ github.workspace }}/melange.rsa.pub
          archs: x86_64

      - name: apko publish (php-fpm image + SBOM)
        uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          config: ${{ steps.render.outputs.dir }}/apko-fpm.yaml
          tag: ${{ steps.tags.outputs.tags_fpm }}
          repository-append: ${{ github.workspace }}/${{ steps.render.outputs.dir }}/packages
          keyring-append: ${{ github.workspace }}/melange.rsa.pub
          archs: x86_64

      - name: Resolve digests
        id: publish
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          TAGS_FPM: ${{ steps.tags.outputs.tags_fpm }}
          VERSION: ${{ steps.render.outputs.version }}
          EPOCH: ${{ steps.render.outputs.epoch }}
        run: |
          {
            echo "### PHP $VERSION-r$EPOCH"
            echo
            echo "- patches applied: ${{ steps.render.outputs.patches }}"
          } >> "$GITHUB_STEP_SUMMARY"
          for flavor in "" -fpm; do
            var="TAGS${flavor//-/_}"; var="${var^^}"
            read -ra tags <<< "${!var}"
            # Pin to the digest the tags resolve to (the OCI index), not a per-arch manifest.
            digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
            ref="${IMAGE,,}@$digest"
            echo "ref${flavor//-/_}=$ref" >> "$GITHUB_OUTPUT"
            {
              echo "- digest${flavor}: \`$ref\`"
              printf -- '  - tag: `%s`\n' "${tags[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke test
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_FPM: ${{ steps.publish.outputs.ref_fpm }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          docker run --rm "$REF" -v | tee /dev/stderr | grep -q "PHP $VERSION "
          docker run --rm "$REF" -r 'exit(file_exists("/usr/bin/php-fpm") ? 1 : 0);'
          docker run --rm --entrypoint /usr/bin/php-fpm "$REF_FPM" -t -y /etc/php/php-fpm.conf
          # fpm must come up as nonroot and stay up
          docker run -d --name fpm "$REF_FPM"
          sleep 3
          docker logs fpm 2>&1 | tee /dev/stderr | grep -q "ready to handle connections"
          test "$(docker inspect -f '{{.State.Running}}' fpm)" = true
          docker rm -f fpm

      # apko-publish authenticates on its own; cosign needs a docker login.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: cosign sign (keyless)
        env:
          REF: ${{ steps.publish.outputs.ref }}
          REF_FPM: ${{ steps.publish.outputs.ref_fpm }}
        # --recursive signs the index and every per-arch manifest under it
        run: cosign sign --yes --recursive "$REF" "$REF_FPM"

      - name: cosign verify (by tag, as users will)
        env:
          BRANCH: ${{ steps.render.outputs.branch }}
        run: |
          for tag in "${IMAGE,,}:$BRANCH" "${IMAGE,,}:$BRANCH-fpm"; do
            cosign verify "$tag" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $tag"
          done

      # Trivy + Grype scan; results are attached to the image as signed
      # cosign vuln attestations. Informational: does not fail the build.
      - name: Vulnerability scan + attestation
        uses: chainguard-images/actions/vul-scans@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
        with:
          image: ${{ steps.publish.outputs.ref }}
          RUN_SNYK: "false"
