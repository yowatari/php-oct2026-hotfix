name: build

on:
  push:
    paths:
      - melange.tmpl.yaml
      - apko.tmpl.yaml
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON list of PHP versions, e.g. ["8.5.12","7.4.33"]'
        required: false
        default: ""

permissions:
  contents: read

env:
  # Supported branches: fixed tarballs. EOL branches: last tarball + patches/<branch>/.
  DEFAULT_VERSIONS: '["8.5.12","8.4.27","8.3.36","8.2.35","8.1.34","8.0.30","7.4.33"]'
  MELANGE_IMAGE: cgr.dev/chainguard/melange:latest
  APKO_IMAGE: cgr.dev/chainguard/apko:latest

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.versions }}
        run: echo "versions=${INPUT:-$DEFAULT_VERSIONS}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Render melange/apko config
        id: render
        run: scripts/render.sh "${{ matrix.version }}"

      - name: melange keygen
        run: docker run --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" keygen melange.rsa

      - name: melange build (fetch, patch, compile, test)
        run: |
          docker run --privileged --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" \
            build "${{ steps.render.outputs.dir }}/melange.yaml" \
            --arch x86_64 \
            --signing-key melange.rsa \
            --source-dir "${{ steps.render.outputs.dir }}/src" \
            --out-dir "${{ steps.render.outputs.dir }}/packages"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: apko publish (image + SBOM)
        id: publish
        env:
          VERSION: ${{ steps.render.outputs.version }}
          BRANCH: ${{ steps.render.outputs.branch }}
          EPOCH: ${{ steps.render.outputs.epoch }}
          DIR: ${{ steps.render.outputs.dir }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$image:$VERSION-r$EPOCH" "$image:$BRANCH")
          # A pristine tarball build may also own the bare version tag.
          [ "$EPOCH" = 0 ] && tags+=("$image:$VERSION")
          docker run --rm -v "$PWD":/work -w /work -v "$HOME/.docker":/root/.docker:ro "$APKO_IMAGE" \
            publish "$DIR/apko.yaml" "${tags[@]}" --image-refs "$DIR/image-refs.txt"
          ref="$(head -n1 "$DIR/image-refs.txt")" # image@sha256:...
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "### PHP $VERSION-r$EPOCH"
            echo
            echo "- patches applied: ${{ steps.render.outputs.patches }}"
            echo "- digest: \`$ref\`"
            printf -- '- tag: `%s`\n' "${tags[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          REF: ${{ steps.publish.outputs.ref }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          docker run --rm "$REF" -v | tee /dev/stderr | grep -q "PHP $VERSION "
          docker run --rm --entrypoint /usr/bin/php-fpm "$REF" -t -y /etc/php/php-fpm.conf

      - uses: sigstore/cosign-installer@v3

      - name: cosign sign (keyless)
        env:
          REF: ${{ steps.publish.outputs.ref }}
        run: cosign sign --yes "$REF"
